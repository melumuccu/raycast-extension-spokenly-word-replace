[tools]
node = "22.22.2"
pnpm = "10"
pre-commit = "4"
gitleaks = "8"

[env]
_.path = ["./node_modules/.bin"]

[tasks.install]
description = "Install dependencies"
run = "pnpm install"

[tasks.dev]
description = "Run Raycast extension in development mode"
run = "ray develop"

[tasks.lint]
description = "Run linters"
run = "pnpm run lint"

[tasks.format]
description = "Format source files (pass file paths after --)"
run = "prettier --write"

[tasks.test]
description = "Run unit tests"
run = "vitest run"

[tasks.build]
description = "Build Raycast extension distribution"
run = "ray build -e dist"

[tasks.check]
description = "Run lint, test, and build"
depends = ["lint", "test", "build"]

[tasks.hooks-install]
description = "Install pre-commit and pre-push hooks"
run = ["pre-commit install", "pre-commit install --hook-type pre-push"]

[tasks."secrets:scan"]
description = "Scan repository for secrets"
run = "gitleaks detect --source . --no-banner --redact"

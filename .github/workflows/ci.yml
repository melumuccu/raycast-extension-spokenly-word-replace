name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: [self-hosted, raycast-extension-spokenly-word-replace]
    steps:
      - uses: actions/checkout@v4
      - name: Configure cache directories
        run: |
          echo "MISE_DATA_DIR=$RUNNER_TOOL_CACHE/mise" >> "$GITHUB_ENV"
          echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TOOL_CACHE/pnpm-store" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TOOL_CACHE/mise" "$RUNNER_TOOL_CACHE/pnpm-store"
      - uses: jdx/mise-action@v3
        with:
          cache: false
          config_files: mise.ci.toml
      - name: Install dependencies
        run: mise run install
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
      - name: Build
        run: mise run build
